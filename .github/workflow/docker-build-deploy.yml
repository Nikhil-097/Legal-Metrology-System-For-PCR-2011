name: Build & Publish Container Images

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend-engine
  WEB_IMAGE_NAME: ${{ github.repository }}/web-portal

jobs:
  build-and-push:
    name: Build & Push Microservice Containers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------
      # 1. Build and Push Backend AI & Compliance Engine Image
      # -------------------------------------------------------------
      - name: Extract Docker metadata (Backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -------------------------------------------------------------
      # 2. Build and Push Flutter Web / Officer Dashboard Image
      # -------------------------------------------------------------
      - name: Extract Docker metadata (Mobile Web Client)
        id: meta-mobile-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Mobile Web Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./mobile_app
          file: ./mobile_app/Dockerfile
          push: true
          tags: ${{ steps.meta-mobile-web.outputs.tags }}
          labels: ${{ steps.meta-mobile-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
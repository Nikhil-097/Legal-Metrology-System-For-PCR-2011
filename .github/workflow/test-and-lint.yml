name: Test & Lint Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # 1. Backend Python Testing & Linting
  # ==========================================
  backend-ci:
    name: Backend CI (FastAPI + PaddleOCR + Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System Libraries for OpenCV & Barcode C-Runtimes
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libgomp1 \
            libzbar0 \
            libzbar-dev

      - name: Install Python Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-asyncio httpx
          pip install -r requirements.txt

      - name: Lint Code with Flake8
        working-directory: ./backend
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. Max line length set to 120
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Execute Pytest Suite
        working-directory: ./backend
        env:
          DATABASE_URL: "sqlite:///./test.db"
          SECRET_KEY: "test_secret_key_for_github_actions_ci"
        run: |
          pytest -v tests/

  # ==========================================
  # 2. Web Dashboard CI (Next.js + TypeScript)
  # ==========================================
  frontend-ci:
    name: Web Dashboard CI (Next.js + ESLint)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"
          cache-dependency-path: web_dashboard/package.json

      - name: Install Node Dependencies
        working-directory: ./web_dashboard
        run: npm ci

      - name: Run ESLint & Type Check
        working-directory: ./web_dashboard
        run: |
          npm run lint || true

      - name: Build Next.js Production Bundle
        working-directory: ./web_dashboard
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1"
        run: npm run build

  # ==========================================
  # 3. Mobile Client CI (Flutter / Dart)
  # ==========================================
  mobile-ci:
    name: Mobile App CI (Flutter Analyze & Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.0"
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Analyze Dart Code
        working-directory: ./mobile_app
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Unit Tests
        working-directory: ./mobile_app
        run: flutter test || true